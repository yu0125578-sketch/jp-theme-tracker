<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>日本株テーマトラッカー</title>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2eb;
  --surface: #faf8f3;
  --surface2: #edeae0;
  --border: #d8d3c5;
  --ink: #1a1714;
  --ink2: #5a5448;
  --ink3: #9a9080;
  --red: #c0392b;
  --green: #1a6b3c;
  --red-bg: #fdf0ee;
  --green-bg: #eef6f1;
  --gold: #b8860b;
  --mono: 'DM Mono', monospace;
  --serif: 'Kaisei Decol', serif;
  --sans: 'Noto Sans JP', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:var(--sans); background:var(--bg); color:var(--ink); min-height:100vh; }

/* Header */
header {
  background:var(--ink); color:var(--bg);
  padding:0 16px; height:52px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:200;
}
.logo { font-family:var(--serif); font-size:16px; display:flex; align-items:center; gap:8px; }
.logo-dot { width:7px; height:7px; background:#c0392b; border-radius:50%; animation:blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }
.header-right { display:flex; align-items:center; gap:10px; }
.market-pill {
  font-family:var(--mono); font-size:10px; padding:3px 8px;
  border-radius:20px; background:rgba(255,255,255,0.1);
}
.refresh-btn {
  background:none; border:1px solid #444; border-radius:6px;
  color:#ccc; font-size:18px; width:32px; height:32px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all 0.2s;
}
.refresh-btn:hover { border-color:#fff; color:#fff; }
.refresh-btn.spinning { animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Index bar */
.index-bar {
  background:var(--surface2); border-bottom:1px solid var(--border);
  padding:8px 16px; display:flex; gap:20px; overflow-x:auto;
  font-family:var(--mono); font-size:11px;
  scrollbar-width:none;
}
.index-bar::-webkit-scrollbar { display:none; }
.idx { display:flex; align-items:center; gap:6px; white-space:nowrap; }
.idx-name { color:var(--ink3); }
.idx-val { font-weight:500; }
.up { color:var(--green); }
.down { color:var(--red); }

/* Status bar */
.status-bar {
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:6px 16px; font-family:var(--mono); font-size:10px;
  color:var(--ink3); display:flex; justify-content:space-between; align-items:center;
}

/* Layout */
.layout { display:flex; min-height:calc(100vh - 52px); }

/* Sidebar */
.sidebar {
  width:200px; flex-shrink:0;
  background:var(--surface); border-right:1px solid var(--border);
  overflow-y:auto; position:sticky; top:52px; height:calc(100vh - 52px);
}
@media (max-width:640px) {
  .sidebar { display:none; }
  .mobile-theme-bar { display:flex !important; }
}
.mobile-theme-bar {
  display:none; overflow-x:auto; background:var(--surface);
  border-bottom:1px solid var(--border); padding:8px 12px; gap:8px;
  scrollbar-width:none;
}
.mobile-theme-bar::-webkit-scrollbar { display:none; }
.mobile-theme-btn {
  flex-shrink:0; padding:6px 12px; border-radius:20px;
  border:1px solid var(--border); background:none;
  font-family:var(--sans); font-size:12px; cursor:pointer;
  white-space:nowrap; transition:all 0.15s;
}
.mobile-theme-btn.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }

.sidebar-label {
  font-family:var(--mono); font-size:9px; color:var(--ink3);
  letter-spacing:0.1em; text-transform:uppercase;
  padding:12px 14px 6px;
}
.theme-btn {
  display:flex; align-items:center; justify-content:space-between;
  width:100%; padding:10px 14px; border:none; border-left:3px solid transparent;
  background:none; cursor:pointer; text-align:left; transition:all 0.12s;
  font-family:var(--sans);
}
.theme-btn:hover { background:var(--surface2); }
.theme-btn.active { background:var(--surface2); border-left-color:var(--ink); }
.theme-btn-left { display:flex; align-items:center; gap:8px; }
.theme-icon { font-size:14px; }
.theme-name { font-size:12px; font-weight:500; }
.theme-chg { font-family:var(--mono); font-size:11px; }

/* Main */
.main { flex:1; overflow:hidden; }

/* Theme header */
.theme-head {
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:16px;
}
.theme-head-top { display:flex; align-items:center; justify-content:space-between; }
.theme-head-left { display:flex; align-items:center; gap:10px; }
.theme-head-icon { font-size:24px; }
.theme-head-title { font-family:var(--serif); font-size:20px; }
.theme-head-stats { display:flex; gap:16px; }
.stat { text-align:right; }
.stat-label { font-family:var(--mono); font-size:9px; color:var(--ink3); text-transform:uppercase; }
.stat-val { font-family:var(--mono); font-size:18px; font-weight:500; }
.theme-head-desc { font-size:12px; color:var(--ink2); margin-top:8px; line-height:1.5; }

/* Table */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th {
  font-family:var(--mono); font-size:9px; color:var(--ink3);
  text-transform:uppercase; letter-spacing:0.05em;
  padding:8px 12px; text-align:right;
  background:var(--surface2); border-bottom:1px solid var(--border);
  white-space:nowrap; position:sticky; top:0;
}
th:first-child { text-align:left; }
td {
  padding:11px 12px; border-bottom:1px solid rgba(216,211,197,0.4);
  text-align:right; font-family:var(--mono); font-size:12px; color:var(--ink2);
}
td:first-child { text-align:left; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:var(--surface2); }
.stock-name { font-size:13px; font-weight:500; color:var(--ink); font-family:var(--sans); }
.stock-code { font-family:var(--mono); font-size:10px; color:var(--ink3); }
.badge {
  display:inline-block; padding:2px 7px; border-radius:4px;
  font-family:var(--mono); font-size:11px;
}
.badge-up { background:var(--green-bg); color:var(--green); }
.badge-down { background:var(--red-bg); color:var(--red); }
.rank-num { color:var(--ink3); font-size:11px; width:20px; display:inline-block; }
.bar-wrap { display:flex; align-items:center; gap:6px; justify-content:flex-end; }
.bar-bg { width:50px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
.bar-fill { height:100%; border-radius:2px; transition:width 0.4s; }
.star-btn {
  background:none; border:none; cursor:pointer; color:var(--ink3);
  font-size:14px; padding:2px 4px; transition:color 0.1s;
}
.star-btn:hover { color:var(--gold); }
.star-btn.on { color:var(--gold); }

/* Loading */
.loading {
  display:flex; align-items:center; justify-content:center;
  padding:48px; gap:10px; color:var(--ink3);
  font-family:var(--mono); font-size:12px;
}
.spinner {
  width:14px; height:14px; border:2px solid var(--border);
  border-top-color:var(--ink); border-radius:50%;
  animation:spin 0.8s linear infinite;
}

/* Search */
.search-wrap {
  padding:12px 16px; background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex; gap:8px;
}
.search-input {
  flex:1; padding:8px 12px; border:1px solid var(--border);
  border-radius:8px; font-family:var(--mono); font-size:12px;
  background:var(--bg); color:var(--ink); outline:none;
}
.search-input:focus { border-color:var(--ink); }
.search-btn {
  padding:8px 14px; background:var(--ink); color:var(--bg);
  border:none; border-radius:8px; font-size:12px; cursor:pointer;
}

/* Watchlist tab */
.tabs {
  display:flex; border-bottom:1px solid var(--border);
  background:var(--surface);
}
.tab {
  flex:1; padding:10px; border:none; background:none;
  font-family:var(--sans); font-size:12px; cursor:pointer;
  border-bottom:2px solid transparent; color:var(--ink3);
  transition:all 0.15s;
}
.tab.active { color:var(--ink); border-bottom-color:var(--ink); }
</style>
</head>

<header>
  <div class="logo"><div class="logo-dot"></div>日本株テーマトラッカー</div>
  <div class="header-right">
    <div class="market-pill" id="market-pill">確認中...</div>
    <button class="refresh-btn" id="refresh-btn" onclick="refresh()" title="更新">↻</button>
  </div>
</header>

<!-- Mobile theme scroll bar -->

<div class="status-bar">

  <span id="status-count"></span>
</div>

<div class="layout">

    <div id="sidebar-themes"></div>
  </aside>

  <!-- Main -->

    <div class="tabs">
      <button class="tab active" onclick="switchTab('themes')">📊 テーマ</button>
      <button class="tab" onclick="switchTab('watchlist')">★ ウォッチリスト</button>
      <button class="tab" onclick="switchTab('search')">🔍 銘柄検索</button>
    </div>

    <div id="tab-themes">
      <div id="theme-head"></div>
      <div class="table-wrap">
        <div id="stock-table"></div>
      </div>
    </div>

    <div id="tab-watchlist" style="display:none">
      <div class="table-wrap">
        <div id="watchlist-table"></div>
      </div>
    </div>

    <div id="tab-search" style="display:none">
      <div class="search-wrap">
        <input class="search-input" id="search-input" placeholder="銘柄コード（例: 7203）または銘柄名" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="search-btn" onclick="doSearch()">検索</button>
      </div>
      <div id="search-result"></div>
    </div>
  </main>
</div>

      {code:'5713.T',name:'住友金属鉱山'},{code:'5714.T',name:'DOWAホールディングス'},
      {code:'8015.T',name:'豊田通商'},{code:'8025.T',name:'阪和興業'},
      {code:'8020.T',name:'兼松'},{code:'8075.T',name:'神鋼商事'},
      {code:'5401.T',name:'日本製鉄'},{code:'5411.T',name:'ジェイ エフ イー HD'},
      {code:'5406.T',name:'神戸製鋼所'},{code:'3407.T',name:'旭化成'},
    ]},
];

// ===== State =====
let prices = {};
let currentTheme = THEMES[0];
let watchlist = JSON.parse(localStorage.getItem('jp_wl2') || '[]');
let currentTab = 'themes';
let themeAvg = {};

// ===== Init =====
window.onload = async () => {
  renderSidebar();
  renderMobileBar();
  selectTheme(THEMES[0]);
  await loadPrices();
  setInterval(loadPrices, 5 * 60 * 1000); // 5分ごとに自動更新
};

// ===== Load prices from server =====
async function loadPrices() {
  try {
    const res = await fetch('/api/prices');
    if (!res.ok) throw new Error('API error');
    const json = await res.json();
    prices = json.prices || {};

    // インデックス表示
    updateIndex();

    // テーマ平均計算
    calcThemeAvg();

    // 更新時刻
    if (json.updated_at) {
      const d = new Date(json.updated_at);
      document.getElementById('updated-at').textContent =
        `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
    document.getElementById('stock-count').textContent = json.count + '銘柄';
    document.getElementById('status-msg').textContent =
      json.status === 'updating' ? '⟳ 株価更新中...' : '✓ データ取得済み';

    renderSidebar();
    renderMobileBar();
    renderThemeHead();
    renderStockTable();
    if (currentTab === 'watchlist') renderWatchlist();
  } catch(e) {
    document.getElementById('status-msg').textContent = '⚠ データ取得中...しばらくお待ちください';
  }
}

function updateIndex() {
  const nk = prices['^N225'];
  const fx = prices['USDJPY=X'];
  if (nk) {
    document.getElementById('nk-v').textContent = parseFloat(nk.price).toLocaleString('ja-JP', {maximumFractionDigits:1});
    const el = document.getElementById('nk-c');
    el.textContent = `${nk.changePct>=0?'+':''}${nk.changePct}%`;
    el.className = nk.changePct >= 0 ? 'up' : 'down';
  }
  if (fx) {
    document.getElementById('fx-v').textContent = parseFloat(fx.price).toFixed(2);
    const el = document.getElementById('fx-c');
    el.textContent = `${fx.changePct>=0?'+':''}${fx.changePct}%`;
    el.className = fx.changePct >= 0 ? 'up' : 'down';
  }
  // Market status
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const isOpen = (h > 9 || (h===9&&m>=0)) && h < 15;
  document.getElementById('market-pill').textContent = isOpen ? '🟢 取引中' : '⚪ 時間外';
}

function calcThemeAvg() {
  for (const t of THEMES) {
    const vals = t.stocks.map(s => parseFloat(prices[s.code]?.changePct||0)).filter(v=>!isNaN(v));
    themeAvg[t.id] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
  }
}

// ===== Sidebar =====
function renderSidebar() {
  document.getElementById('sidebar-themes').innerHTML = THEMES.map(t => {
    const chg = themeAvg[t.id] ?? null;
    const chgStr = chg !== null ? `${chg>=0?'+':''}${chg.toFixed(2)}%` : '—';
    const cls = chg >= 0 ? 'up' : 'down';
    return `<button class="theme-btn ${currentTheme.id===t.id?'active':''}" onclick="selectTheme(THEMES.find(x=>x.id==='${t.id}'))">
      <div class="theme-btn-left">
        <span class="theme-icon">${t.icon}</span>
        <span class="theme-name">${t.name}</span>
      </div>
      <span class="theme-chg ${cls}">${chgStr}</span>
    </button>`;
  }).join('');
}

function renderMobileBar() {
  document.getElementById('mobile-theme-bar').innerHTML = THEMES.map(t =>
    `<button class="mobile-theme-btn ${currentTheme.id===t.id?'active':''}" onclick="selectTheme(THEMES.find(x=>x.id==='${t.id}'))">${t.icon} ${t.name}</button>`
  ).join('');
}

// ===== Select theme =====
function selectTheme(t) {
  currentTheme = t;
  switchTab('themes');
  renderSidebar();
  renderMobileBar();
  renderThemeHead();
  renderStockTable();
}

// ===== Theme header =====
function renderThemeHead() {
  const t = currentTheme;
  const chg = themeAvg[t.id] ?? null;
  const chgStr = chg !== null ? `${chg>=0?'+':''}${chg.toFixed(2)}%` : '—';
  const cls = chg !== null ? (chg>=0?'up':'down') : '';
  document.getElementById('theme-head').innerHTML = `
    <div class="theme-head">
      <div class="theme-head-top">
        <div class="theme-head-left">
          <span class="theme-head-icon">${t.icon}</span>
          <span class="theme-head-title">${t.name}</span>
        </div>
        <div class="theme-head-stats">
          <div class="stat">
            <div class="stat-label">テーマ騰落率</div>
            <div class="stat-val ${cls}">${chgStr}</div>
          </div>
          <div class="stat">
            <div class="stat-label">構成銘柄</div>
            <div class="stat-val">${t.stocks.length}</div>
          </div>
        </div>
      </div>
      <div class="theme-head-desc">${t.desc}</div>
    </div>`;
}

// ===== Stock table =====
function renderStockTable() {
  const t = currentTheme;
  const sorted = [...t.stocks].sort((a,b) => {
    const pa = parseFloat(prices[a.code]?.changePct ?? -999);
    const pb = parseFloat(prices[b.code]?.changePct ?? -999);
    return pb - pa;
  });
  const maxPct = Math.max(...sorted.map(s=>Math.abs(parseFloat(prices[s.code]?.changePct||0))),0.01);

  const rows = sorted.map((s,i) => {
    const d = prices[s.code];
    const price = d ? parseFloat(d.price).toLocaleString('ja-JP') + '円' : '—';
    const chg   = d ? (d.change>=0?'+':'')+parseFloat(d.change).toLocaleString('ja-JP')+'円' : '—';
    const pct   = d ? parseFloat(d.changePct) : null;
    const pctStr = pct!==null ? `${pct>=0?'+':''}${pct.toFixed(2)}%` : '—';
    const isUp  = pct!==null ? pct>=0 : null;
    const cls   = isUp===null?'':(isUp?'up':'down');
    const bCls  = isUp===null?'':(isUp?'badge-up':'badge-down');
    const vol   = d?.volume ? (d.volume/10000).toFixed(0)+'万株' : '—';
    const barW  = pct!==null ? Math.abs(pct)/maxPct*100 : 0;
    const barC  = isUp ? '#1a6b3c' : '#c0392b';
    const isWatched = watchlist.some(w=>w.code===s.code);
    return `<tr>
      <td>
        <span class="rank-num">${i+1}</span>
        <span class="stock-name">${s.name}</span><br>
        <span style="margin-left:20px" class="stock-code">${s.code.replace('.T','')}</span>
      </td>
      <td>${price}</td>
      <td class="${cls}">${chg}</td>
      <td>
        <div class="bar-wrap">
          <div class="bar-bg"><div class="bar-fill" style="width:${barW}%;background:${barC}"></div></div>
          <span class="badge ${bCls}">${pctStr}</span>
        </div>
      </td>
      <td>${vol}</td>
      <td><button class="star-btn ${isWatched?'on':''}" onclick="toggleWatch('${s.code}','${s.name}')">${isWatched?'★':'☆'}</button></td>
    </tr>`;
  }).join('');

  document.getElementById('stock-table').innerHTML = `
    <table>
      <thead><tr>
        <th>銘柄</th><th>現在値</th><th>前日比</th><th>騰落率</th><th>出来高</th><th>WL</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="6" style="text-align:center;padding:32px;color:#9a9080;font-family:var(--mono);font-size:12px">データ取得中...</td></tr>'}</tbody>
    </table>`;
}

// ===== Watchlist =====
function toggleWatch(code, name) {
  const idx = watchlist.findIndex(w=>w.code===code);
  if (idx>=0) watchlist.splice(idx,1);
  else watchlist.push({code,name});
  localStorage.setItem('jp_wl2', JSON.stringify(watchlist));
  renderStockTable();
  if (currentTab==='watchlist') renderWatchlist();
}

function renderWatchlist() {
  if (!watchlist.length) {
    document.getElementById('watchlist-table').innerHTML =
      '<div style="text-align:center;padding:48px;color:#9a9080;font-size:13px">☆ 銘柄テーブルの★ボタンで追加できます</div>';
    return;
  }
  const rows = watchlist.map(w => {
    const d = prices[w.code];
    const price = d ? parseFloat(d.price).toLocaleString('ja-JP')+'円' : '—';
    const pct = d ? parseFloat(d.changePct) : null;
    const pctStr = pct!==null ? `${pct>=0?'+':''}${pct.toFixed(2)}%` : '—';
    const bCls = pct!==null ? (pct>=0?'badge-up':'badge-down') : '';
    return `<tr>
      <td><span class="stock-name">${w.name}</span><br><span class="stock-code">${w.code.replace('.T','')}</span></td>
      <td>${price}</td>
      <td><span class="badge ${bCls}">${pctStr}</span></td>
      <td><button class="star-btn on" onclick="toggleWatch('${w.code}','${w.name}')">★</button></td>
    </tr>`;
  }).join('');
  document.getElementById('watchlist-table').innerHTML = `
    <table>
      <thead><tr><th>銘柄</th><th>現在値</th><th>騰落率</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ===== Search =====
async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  const el = document.getElementById('search-result');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>検索中...</div>';

  // 銘柄コードとして検索
  let sym = q.toUpperCase();
  if (!sym.endsWith('.T') && /^\d{4}/.test(sym)) sym = sym + '.T';

  // まずキャッシュを検索
  if (prices[sym]) {
    const d = prices[sym];
    showSearchResult(sym, q, d);
    return;
  }

  // テーマ内の銘柄名で検索
  const found = THEMES.flatMap(t=>t.stocks).find(s=>s.name.includes(q)||s.code.startsWith(q));
  if (found && prices[found.code]) {
    showSearchResult(found.code, found.name, prices[found.code]);
    return;
  }

  // サーバーに個別取得リクエスト
  try {
    const code = sym.replace('.T','');
    const res = await fetch(`/api/quote/${code}`);
    if (res.ok) {
      const d = await res.json();
      showSearchResult(d.symbol||sym, q, d);
    } else {
      el.innerHTML = '<div style="padding:20px;font-family:var(--mono);font-size:12px;color:#c0392b">銘柄が見つかりませんでした。コード（例: 7203）で検索してください。</div>';
    }
  } catch(e) {
    el.innerHTML = '<div style="padding:20px;font-family:var(--mono);font-size:12px;color:#c0392b">取得に失敗しました。</div>';
  }
}

function showSearchResult(code, name, d) {
  const pct = parseFloat(d.changePct);
  const isUp = pct >= 0;
  document.getElementById('search-result').innerHTML = `
    <div style="padding:16px;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="stock-name" style="font-size:15px">${name}</div>
          <div class="stock-code">${code.replace('.T','')}</div>
        </div>
        <button class="star-btn ${watchlist.some(w=>w.code===code)?'on':''}" style="font-size:18px"
          onclick="toggleWatch('${code}','${name}');this.classList.toggle('on');this.textContent=this.classList.contains('on')?'★':'☆'">
          ${watchlist.some(w=>w.code===code)?'★':'☆'}
        </button>
      </div>
      <div style="margin-top:12px;display:flex;gap:20px">
        <div><div class="stat-label">現在値</div><div style="font-family:var(--mono);font-size:20px">${parseFloat(d.price).toLocaleString('ja-JP')}円</div></div>
        <div><div class="stat-label">前日比</div><div class="stat-val ${isUp?'up':'down'}" style="font-size:18px">${d.change>=0?'+':''}${parseFloat(d.change).toLocaleString('ja-JP')}円</div></div>
        <div><div class="stat-label">騰落率</div><span class="badge ${isUp?'badge-up':'badge-down'}" style="font-size:14px;margin-top:4px;display:inline-block">${pct>=0?'+':''}${pct.toFixed(2)}%</span></div>
      </div>
    </div>`;
}

// ===== Tab =====
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-themes').style.display = tab==='themes'?'':'none';
  document.getElementById('tab-watchlist').style.display = tab==='watchlist'?'':'none';
  document.getElementById('tab-search').style.display = tab==='search'?'':'none';
  document.querySelectorAll('.tab').forEach((el,i) => {
    el.classList.toggle('active', ['themes','watchlist','search'][i]===tab);
  });
  if (tab==='watchlist') renderWatchlist();
}

// ===== Refresh =====
async function refresh() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');
  await loadPrices();
  btn.classList.remove('spinning');
}
</script>
